[project]
name = "claude-swap"
version = "0.27.0b1"
description = "Multi-account switcher for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Windows-only: needed solely by the one-time keyring -> files migration
    # (migrations.py) for users upgrading from <=0.10.x. macOS/Linux never
    # import it on the hot path; the macOS migration has a security-CLI
    # fallback and the legacy purge sweep no-ops when it's absent.
    "keyring>=25.0.0; sys_platform == 'win32'",
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
]
authors = [{name = "Onur Cetinkol", email = "onurcetinkol@gmail.com"}]
license = {text = "MIT"}
keywords = ["claude", "claude-code", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]
# A CORRECTNESS FLOOR, not a freshness one: below it, this branch's
# `apply_pin(identity=...)` is a TypeError at the call rather than a degraded
# feature. Raise it for each API this branch requires OUTRIGHT, and name the
# error the old version actually raises. `heal(identity=...)` is deliberately
# NOT covered -- the caller probes the installed signature and falls back to
# the positional form -- so do not raise the floor for it and do not delete
# that probe as redundant. `carry_live_pointers` and `remembered_pin_identity`
# are not covered either: absent below 0.1.223 and 0.1.215, `_ask` answers None
# there, and both callers read None as the behaviour they had before the seam
# existed. Degraded, not a TypeError -- which is what keeps this floor a
# correctness one.
#
# NO `; sys_platform != 'win32'` MARKER (proposed twice): the dev group
# installs this so the seam test runs on Windows too, and a marker makes that
# test decorative instead of red.
pin = ["cswap-pin>=0.1.143"]

[project.urls]
Homepage = "https://github.com/realiti4/claude-swap"
Repository = "https://github.com/realiti4/claude-swap"
Issues = "https://github.com/realiti4/claude-swap/issues"

[project.scripts]
claude-swap = "claude_swap.cli:main"
cswap = "claude_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_swap"]

[dependency-groups]
# `pytest>=9.0`, NOT 8: `faulthandler_exit_on_timeout` below landed in
# 9.0.0. On 8.x it is an unknown ini key -- a `PytestConfigWarning` in a
# wall of output, no abort, and the hang the option exists to end. CI is
# safe either way (`uv sync --locked`); an editable install inside the
# declared range was not.
#
# `claude-swap[pin]`, NOT a second `cswap-pin>=...`: the extra above is the one
# floor, and spelling the version again here is how the two drift.
#
# The extra has to be installed somewhere or its contract is untested. cswap
# READS a marker cswap-pin WRITES and the two version independently, so
# `test_the_marker_still_matches_the_package_that_writes_it` is the only thing
# standing between a rename there and `--clear` reporting "No cloud account
# pinned" over a live wiring. `uv sync --locked` installs base + dev only, so
# without this it never ran.
#
# This does NOT weaken "works without the extra": `TestImportSafeWithoutTheExtra`
# and `TestClearRunsWithTheExtraGone` block `cswap_pin` at `sys.meta_path` or
# scan the AST, so they hold whether or not the package is present.
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "claude-swap[pin]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A THREAD THAT DIES ON AN EXCEPTION FAILS THE RUN. Unhandled it is only a
# warning, and a warning in a list of ~50 is read by nobody: one sat on every
# run for as long as anyone had looked. This makes the next one fail instead
# of joining the list.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
# Parallel by default. The suite is ~1900 tests of mostly-idle work (file
# locks, subprocess fakes, Textual pilots), so wall clock was dominated by
# doing them one at a time, not by any single slow test: 25 ms/test spread
# across the whole suite, with the top five totalling under 7 s of a 51 s run.
# Measured here, 48 cores: 51.0s serial -> 12.1s (-n 8) -> 7.7s (-n 16), same
# 1929 passed / 4 skipped every time, three consecutive runs, real account
# store hash unmoved.
#
# `auto` here so any machine scales from the cores it has. CI OVERRIDES IT with
# `-n 8` (see .github/workflows/ci.yml): the work is mostly WAITING, so on a
# runner's 4 vCPUs one-worker-per-core leaves cores idle. Measured on 4 CPUs,
# same 1995 passed: auto(=4) 16.9s, -n 6 14.1s, -n 8 14.5s, -n 10 14.7s. xdist
# takes only `auto`, `logical` or an integer -- no multiplier spelling -- so
# the oversubscription has to be a literal, and a literal belongs where the
# machine is known.
# `--max-worker-restart=0` IS PART OF THE BACKSTOP BELOW, not a tuning
# knob. With the faulthandler set to exit on timeout, a wedged test kills
# its worker -- and under `loadgroup` xdist then wedges in the
# worker-replacement path instead of reporting the item. Measured on a
# 41-test repo with one hanging case and a 3s budget:
#   --dist loadgroup                      rc=124, 0 crash lines (HUNG)
#   --dist load                           rc=1 in 5.4s, names the test
#   --dist loadgroup --max-worker-restart=0  rc=1 in 4.2s, names the test
# `--dist load` is not available here: conftest pins the real-keychain
# group with `xdist_group`, which only `loadgroup` honours.
# `minversion` AND `--strict-config` ask the INSTALLED pytest, which is
# what the failure story is about -- an editable install inside the
# declared range, where `faulthandler_exit_on_timeout` below is an unknown
# ini key and the backstop is inert. A hand-maintained list of
# version-gated options cannot: 9.1 registers nine keys 8.4 does not, and
# a realistic typo of a real one (`max_warnigns`) passed such a guard
# while `--strict-config` gave rc=4 and ran nothing.
minversion = "9.0"
addopts = "-n auto --dist loadgroup --max-worker-restart=0 --strict-config"
# A HANG BECOMES AN ABORT WITH STACKS, with no new dependency: pytest ships
# both of these, and `exit_on_timeout` is what turns the dump into a failure
# instead of a note in a job that keeps running. GitHub's default JOB budget
# is 360 minutes -- a step has no documented default and simply runs until
# that budget cancels it -- so a job without `timeout-minutes` pays six hours
# for a spinning worker and prints no test name.
# PER TEST, not per suite -- pytest arms it in a `pytest_runtest_protocol`
# hookwrapper, so 600s is compared against the slowest SINGLE case (~10s
# here), not against the run. Collection is not covered at all.
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
    "no_oauth_profile_fake: opt out of the autouse fetch_oauth_profile stub (test exercises fetch_oauth_profile itself against a mocked urlopen)",
]
