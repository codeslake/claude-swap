# cswap fork — config for /watch-pr-and-manage-integrated.
# Kept out of git by `.claude/` in .git/info/exclude (per-clone, uncommittable).

UPSTREAM_REPO=realiti4/claude-swap
UPSTREAM_REMOTE=upstream
UPSTREAM_BRANCH=main
FORK_REMOTE=origin

# "integration", not "integrated". All three machines are checked out on it.
INTEGRATED_BRANCH=integration

PR_AUTHOR=codeslake

TEST_CMD='python3 -m pytest -q'
# FORCE_COLOR/NO_COLOR in the shell flip 11 test_switcher.py assertions from
# plain to styled. PR #209 scrubs them in conftest; until it lands, scrub by
# hand before calling those eleven a regression.
TEST_CAVEAT='11 ANSI failures in tests/test_switcher.py under FORCE_COLOR — re-run with `env -u FORCE_COLOR -u NO_COLOR` before calling them ours (fixed by PR #209)'

DEPLOY_HOSTS='lmd42-docker via-work-mac via-personal-mac'

# Branches another session owns that are still merge CANDIDATES. Empty since
# the pin cutover (integration 3827490): the pin left this tree for the
# cswap-pin package, so feat/account-pin-proxy can never merge here again and
# watching it reported "81 commits not in integration" as though that were a
# backlog. A watch on a branch nobody intends to merge is noise that trains you
# to ignore the channel the real ones arrive on.
WATCH_BRANCHES=''

POLL=300

# PR 210 (feat/pin-package-seam) is OWNED by the pin session. We watch it
# because integration merges it, but an event on it is a REPORT, not a task:
# check with that session before acting, and never push to its branch. Two
# sessions fixing one PR is how a fix gets reverted by the other's push.
PEER_OWNED_PRS='210'
PEER_OWNED_CONTACT='cswap_pin_artifacts (ai-inter-session channel: cswap)'
